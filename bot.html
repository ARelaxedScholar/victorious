<!doctype html>
<meta charset="utf-8">
<script>
addEventListener('message', ({ data, ports, source }) => {
  if (source !== parent || data.kind !== 'start' || ports.length !== 1) return;
  const port = ports[0];
  port.postMessage({ stage: 'starting worker' });
  const python = data.language === 'python';
  const moduleURL = python
    ? null
    : 'data:text/javascript;charset=utf-8,' + encodeURIComponent(data.code);
  const pythonBase = new URL('/python/', location.href);
  pythonBase.hostname = '127.0.0.1';
  const workerURL = URL.createObjectURL(new Blob([`
    const rawEmit = self.postMessage.bind(self);
    const subscribe = self.addEventListener.bind(self);
    const jsonStringify = JSON.stringify;
    const isFiniteNum = Number.isFinite;
    const perfNow = performance.now.bind(performance);
    const objCreate = Object.create;
    const objAssign = Object.assign;

    // Emit null-prototype objects so Object.prototype pollution inside the worker cannot inject keys
    const emit = (payload) => rawEmit(objAssign(objCreate(null), payload));

    // Walk the entire prototype chain of self to neutralize dangerous Worker APIs
    function hardenGlobals() {
      const blocked = [
        'postMessage', 'Worker', 'SharedWorker', 'BroadcastChannel', 'MessageChannel',
        'fetch', 'XMLHttpRequest', 'WebSocket', 'EventSource', 'importScripts',
        'caches', 'indexedDB', 'close', 'addEventListener', 'removeEventListener',
        'dispatchEvent', 'onmessage', 'onmessageerror',
      ];
      for (let target = self; target && target !== Object.prototype; target = Object.getPrototypeOf(target)) {
        for (const name of blocked) {
          try {
            Object.defineProperty(target, name, {
              value: undefined,
              writable: false,
              configurable: false,
            });
          } catch {}
        }
      }
      try {
        if (self.navigator && 'sendBeacon' in self.navigator) {
          Object.defineProperty(self.navigator, 'sendBeacon', { value: undefined, writable: false, configurable: false });
        }
      } catch {}
    }

    subscribe('error', (e) => emit({ error: e.message || 'Worker runtime error.' }));
    subscribe('unhandledrejection', (e) => emit({ error: String(e.reason?.message ?? e.reason ?? 'Unhandled rejection.') }));

    async function loadPython() {
      emit({ stage: 'loading Pyodide runtime' });
      const indexURL = ${JSON.stringify(pythonBase.href)};
      importScripts(indexURL + 'pyodide.js');
      const python = await loadPyodide({ indexURL });
      hardenGlobals();
      emit({ stage: 'evaluating Python strategy' });
      python.globals.set('_source', ${JSON.stringify(python ? data.code : '')});
      python.runPython(\`
import builtins, json, sys, types
_loads = json.loads
_dumps = json.dumps
_orig_import = builtins.__import__

# Strip Pyodide JS-bridge finders from sys.meta_path so bots cannot reload 'js' after deleting sys.modules['js']
sys.meta_path[:] = [
    f for f in sys.meta_path
    if "pyodide" not in type(f).__module__.lower() and "jsfinder" not in type(f).__name__.lower()
]

_BLOCKED_PREFIXES = ("js", "pyodide", "_pyodide", "micropip", "emscripten", "urllib", "http", "socket", "ftplib", "smtplib")
for _name in list(sys.modules):
    if _name == "js" or _name.startswith(("js.", "pyodide", "_pyodide", "micropip", "emscripten")):
        sys.modules[_name] = None

def _safe_import(name, globals=None, locals=None, fromlist=(), level=0):
    root = name.split(".", 1)[0]
    if root in _BLOCKED_PREFIXES or name.startswith(("pyodide", "_pyodide")):
        raise ModuleNotFoundError(f"Import of '{name}' is disabled in sandbox.")
    return _orig_import(name, globals, locals, fromlist, level)

builtins.__import__ = _safe_import

# The official bot imports the ladder client, but local play calls decide directly.
sys.modules["websockets"] = types.ModuleType("websockets")
_scope = {"__name__": "victris_submission"}
exec(compile(_source, "submission.py", "exec"), _scope)
_decide = _scope.get("decide")
if not callable(_decide):
    raise ValueError("Define decide(obs, match) in your Python submission.")
def _play(observation, match):
    res = _decide(_loads(observation), _loads(match))
    if not isinstance(res, dict):
        raise ValueError("decide() must return a dict.")
    return _dumps(res, allow_nan=False)
      \`);
      const play = python.globals.get('_play');
      return (obs, match) => play(jsonStringify(obs), jsonStringify(match));
    }

    (async () => {
      try {
        let serialize;
        if (${python}) {
          serialize = await loadPython();
        } else {
          hardenGlobals();
          emit({ stage: 'importing TypeScript strategy' });
          const { decide } = await import(${JSON.stringify(moduleURL)});
          if (typeof decide !== 'function') throw new Error('Export decide(obs, match).');
          serialize = (obs, match) => {
            const res = decide(obs, match);
            if (!res || typeof res !== 'object' || Array.isArray(res)) {
              throw new Error('decide() must return a plain turn object.');
            }
            return jsonStringify(res);
          };
        }
        subscribe('message', ({ data }) => {
          const seq = data?.seq;
          try {
            const t0 = perfNow();
            const turn = serialize(data.observation, data.match);
            const ms = perfNow() - t0;
            if (typeof turn !== 'string' || !turn || turn.length > 4096) {
              throw new Error('Return a turn object under 4096 characters.');
            }
            emit({ seq, turn, ms: isFiniteNum(ms) ? ms : 0 });
          } catch (err) {
            emit({ seq, error: String(err?.message ?? err) });
          }
        });
        emit({ ready: true });
      } catch (err) {
        emit({ error: String(err?.message ?? err) });
      }
    })();
  `], { type: 'text/javascript' }));

  try {
    const worker = new Worker(workerURL);
    const cleanup = () => {
      try { worker.terminate(); } catch {}
      try { URL.revokeObjectURL(workerURL); } catch {}
    };
    worker.onmessage = ({ data }) => port.postMessage(data);
    worker.onerror = (event) => port.postMessage({ error: event.message || 'Worker could not start.' });
    worker.onmessageerror = () => port.postMessage({ error: 'Worker message deserialization failed.' });
    port.onmessage = ({ data }) => {
      if (data?.kind === 'close') {
        cleanup();
        return;
      }
      worker.postMessage(data);
    };
    addEventListener('pagehide', cleanup, { once: true });
  } catch (err) {
    port.postMessage({ error: String(err?.message ?? err) });
  }
}, { once: true });
</script>
